[package]
name = "analytics_app"
version = "0.1.0"
default-run = "analytics_app"
description = "QuantMaster BigCaps desktop shell"
authors = ["BigCaps"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "analytics_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
analytics_commands = { path = "../../../crates/analytics_commands" }
analytics_engine = { path = "../../../crates/analytics_engine" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.2", features = [] }
